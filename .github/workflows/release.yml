# Pushing a tag v<version> builds and tests the project and publishes a GitHub Release with the
# NAR attached. The tag must match the version in pom.xml, and the release notes are the matching
# section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check that the tag matches the project version
        run: |
          VERSION=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in pom.xml ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and test
        run: mvn -B -ntp clean verify
      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { in_section = index($0, "## [" v "]") == 1; next }
            in_section && (printed || NF) { print; printed = 1 }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat release-notes.md
      - name: Create the GitHub release with the NAR attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nifi-informix-dialect-nar/target/nifi-informix-dialect-nar-"$VERSION".nar \
            --verify-tag --title "$VERSION" --notes-file release-notes.md
