name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nifi: ["2.12.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp clean verify -Dnifi.version=${{ matrix.nifi }}
      - name: Upload NAR
        uses: actions/upload-artifact@v4
        with:
          name: nifi-informix-dialect-nar-nifi-${{ matrix.nifi }}
          path: nifi-informix-dialect-nar/target/*.nar

  integration:
    # Real Informix via Testcontainers: ~700 MB image per version, so not on every push
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        informix: ["14.10.FC9W1DE", "15.0.1.0.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Integration tests on Informix ${{ matrix.informix }}
        run: mvn -B -ntp verify -Pintegration-tests -Dinformix.image=icr.io/informix/informix-developer-database:${{ matrix.informix }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-informix-${{ matrix.informix }}
          path: nifi-informix-dialect/target/failsafe-reports

  demo:
    # The Docker demo end to end: Informix + NiFi 2.12.0 + imported flow, rows must arrive in
    # orders_copy and orders_paged, and GenerateTableFetch must have produced SKIP/FIRST statements
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run the demo
        run: cd demo && ./run.sh | tee demo.log
      - name: Check that all seven rows reached both tables
        run: test "$(grep -c '7 row(s) retrieved' demo/demo.log)" -ge 2
      - name: Check that GenerateTableFetch produced SKIP/FIRST statements
        run: grep -q 'SELECT SKIP 2 FIRST 2 \* FROM orders WHERE id <= 5 ORDER BY id' demo/demo.log
      - name: NiFi log on failure
        if: failure()
        run: cd demo && docker compose logs nifi | tail -100
      - name: Stop
        if: always()
        run: cd demo && docker compose down -v
