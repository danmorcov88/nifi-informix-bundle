# NiFi compatibility matrix: for every NiFi 2.x line that ships the Database Dialect Service API,
# compile and unit-test against that API, then load the NAR into the real apache/nifi image of that
# version and enable the service. Also loads the NAR built with the default (latest) API into each
# version, which is what a release artifact looks like to users.
name: NiFi compatibility

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "41 4 * * 0"

jobs:
  nifi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nifi: ["2.2.0", "2.3.0", "2.4.0", "2.5.0", "2.6.0", "2.7.0", "2.8.0", "2.9.0", "2.10.0", "2.11.0", "2.12.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and unit-test against the NiFi ${{ matrix.nifi }} API
        run: mvn -B -ntp verify -Dnifi.version=${{ matrix.nifi }}
      - name: Load the NiFi ${{ matrix.nifi }} build into apache/nifi:${{ matrix.nifi }}
        run: ci/nar-smoke.sh ${{ matrix.nifi }} nifi-informix-dialect-nar/target/*.nar
      - name: Build with the default NiFi API
        run: mvn -B -ntp -q clean package -DskipTests
      - name: Load the default build into apache/nifi:${{ matrix.nifi }}
        run: ci/nar-smoke.sh ${{ matrix.nifi }} nifi-informix-dialect-nar/target/*.nar
